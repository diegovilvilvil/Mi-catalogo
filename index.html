<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ESTA LÍNEA ES CLAVE: Permite cargar las imágenes de Steam directamente sin error 403 Forbidden -->
  <meta name="referrer" content="no-referrer">
  <title>Dota 2 Shop - Catálogo</title>
  <style>
    :root {
      --bg-color: #0b0d12;
      --card-bg: #14161d;
      --card-border: #242935;
      --dota-red: #e93745;
      --dota-gold: #e5a93c;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --btn-green: #25d366;
      --btn-green-hover: #1eb956;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, rgba(233, 55, 69, 0.08), transparent 70%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    .banner-wrapper {
      width: 100%;
      background-color: #050608;
      border-bottom: 2px solid #2a201a;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .banner-img {
      width: 100%;
      max-width: 1280px;
      height: auto;
      display: block;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .filters {
      display: flex;
      gap: 14px;
      margin: 25px 0;
      flex-wrap: wrap;
      background: rgba(20, 22, 29, 0.9);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .filters input, .filters select {
      background-color: #1a1e27;
      color: var(--text-main);
      border: 1px solid #303746;
      padding: 11px 16px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .filters input:focus, .filters select:focus {
      border-color: var(--dota-red);
    }

    .filters input {
      flex: 1;
      min-width: 220px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--dota-gold);
    }

    .card-img-box {
      width: 100%;
      height: 190px;
      background-color: #0c0e13;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px;
    }

    .card-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--dota-gold);
      color: var(--dota-gold);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .hero-name {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .item-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--dota-gold);
    }

    .item-slot {
      font-size: 12px;
      color: #64748b;
    }

    .item-price {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      margin: 8px 0 12px 0;
    }

    .btn-add {
      margin-top: auto;
      background: #232936;
      color: #ffffff;
      border: 1px solid #3c465d;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-add:hover {
      background: var(--dota-red);
      border-color: var(--dota-red);
    }

    .cart-floating-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--btn-green);
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      z-index: 100;
    }

    .cart-count {
      background: #0b0d12;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 12px;
    }

    .cart-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 200;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 380px;
      height: 100%;
      background: #14161d;
      border-left: 1px solid var(--card-border);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .cart-drawer.open {
      transform: translateX(0);
    }

    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-item {
  background: #1c202a;
  padding: 10px 14px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cart-item-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.cart-item-name {
  font-size: 14px;
  word-break: break-word;
}

.cart-item-price {
  font-size: 13px;
  font-weight: 700;
  color: var(--dota-gold);
}

    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--card-border);
      background: #0c0e13;
    }

    .btn-checkout {
      width: 100%;
      background: var(--btn-green);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 12px;
    }

    #statusMsg {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 15px;
    }
 @media (max-width: 600px) {
  .container {
    padding: 0 10px;
  }

  .filters {
    padding: 12px;
    gap: 10px;
  }

  .filters input,
  .filters select {
    width: 100%;
    flex: 1 1 100%;
    min-width: 0;
  }

  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .card-img-box {
    height: 130px;
    padding: 6px;
  }

  .card-body {
    padding: 10px;
    gap: 4px;
  }

  .hero-name {
    font-size: 11px;
  }

  .item-name {
    font-size: 14px;
  }

  .item-slot {
    font-size: 11px;
  }

  .item-price {
    font-size: 16px;
    margin: 4px 0 8px 0;
  }

  .btn-add {
    font-size: 12px;
    padding: 8px 4px;
  }

  .cart-floating-btn {
    bottom: 16px;
    right: 16px;
    padding: 12px 18px;
  }
}   
  </style>
</head>
<body>

<header class="banner-wrapper">
  <img class="banner-img" src="portada.jpg" alt="Tienda Secreta de Sithil">
</header>

<div class="container">
  <div class="filters">
    <input type="text" id="searchInput" placeholder="Buscar por héroe, ítem o espacio...">
    <select id="rarityFilter">
      <option value="">Todas las Rarezas</option>
    </select>
    <select id="slotFilter">
      <option value="">Todos los Espacios</option>
    </select>
  </div>

  <div id="statusMsg">Cargando catálogo directamente desde Google Sheets...</div>
  <div class="grid" id="catalogGrid"></div>
</div>

<button class="cart-floating-btn" id="openCartBtn">
  <span>🛒 Ver Carrito</span>
  <span class="cart-count" id="cartCount">0</span>
</button>

<div class="cart-drawer-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h2 style="color:var(--dota-gold);">Tu Carrito</h2>
    <button id="closeCartBtn" style="background:none;border:none;color:#94a3b8;font-size:24px;cursor:pointer;">&times;</button>
  </div>
  <div class="cart-items" id="cartItemsList"></div>
  <div class="cart-footer">
    <div style="display:flex;justify-content:space-between;font-weight:700;">
      <span>Total:</span>
      <span id="cartTotal" style="color:var(--dota-gold);">S/. 0.00</span>
    </div>
    <button class="btn-checkout" id="checkoutBtn">📱 Pedir por WhatsApp</button>
  </div>
</aside>

<script>
  const WHATSAPP_NUMBER = "51999999999"; 
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQofOtlXuFooWfyffSRWtR8Ui1S029GaMBmkvnLnhFByUjkzTFySvUC-Hqb0Roz0Vd6WJwbcnv-OHFt/pub?gid=0&single=true&output=csv";

  let itemsData = [];
  let cart = [];

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = '';
    let insideQuote = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"' && insideQuote && nextChar === '"') {
        cell += '"';
        i++;
      } else if (char === '"') {
        insideQuote = !insideQuote;
      } else if (char === ',' && !insideQuote) {
        row.push(cell.trim());
        cell = '';
      } else if ((char === '\r' || char === '\n') && !insideQuote) {
        if (char === '\r' && nextChar === '\n') i++;
        row.push(cell.trim());
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
        cell = '';
      } else {
        cell += char;
      }
    }
    if (cell || row.length > 0) {
      row.push(cell.trim());
      rows.push(row);
    }
    return rows;
  }

  function formatSteamUrl(url) {
    if (!url) return "";
    let clean = url.trim();
    // Si es un link de Steam y no tiene la resolución final (/360fx360f), se la agregamos
    if (clean.includes("steamstatic.com") && !clean.endsWith("/360fx360f") && !clean.endsWith("/512fx512f")) {
      clean = clean.replace(/\/+$/, '') + "/360fx360f";
    }
    return clean;
  }

  async function loadCatalog() {
    const status = document.getElementById("statusMsg");
    try {
      const response = await fetch(SHEET_CSV_URL);
      if (!response.ok) throw new Error("Error HTTP al obtener el CSV: " + response.status);
      const csvText = await response.text();

      const rows = parseCSV(csvText);
      itemsData = [];

      for (let i = 2; i < rows.length; i++) {
        const r = rows[i];
        if (!r || r.length < 5) continue;

        const itemName = r[0] || ""; // Columna A
        const heroName = r[1] || ""; // Columna B
        const rarity   = r[2] || ""; // Columna C
        const slot     = r[3] || ""; // Columna D
        let price      = r[4] || ""; // Columna E
        let img        = r[6] || ""; // Columna G

        // Si hay héroe o nombre de ítem y tiene precio o imagen
        if (heroName || itemName) {
          if (price && !price.includes("S/.")) {
            price = `S/. ${price}`;
          }

          // Si el nombre del ítem en columna A está vacío, usamos el slot o "Ítem de [Héroe]"
          const displayName = itemName ? itemName : (slot ? `${slot}` : `Ítem de ${heroName}`);

          itemsData.push({
            id: i,
            nombre: displayName,
            heroe: heroName,
            rareza: rarity,
            espacio: slot,
            precio: price || "Consultar",
            img: formatSteamUrl(img)
          });
        }
      }

      if (itemsData.length === 0) {
        status.innerText = "No se encontraron ítems en las filas de la hoja.";
        return;
      }

      status.style.display = "none";
      populateDropdowns(itemsData);
      renderGrid(itemsData);

    } catch (err) {
      status.innerHTML = `<span style="color:#ef4444;">Error al procesar el archivo CSV. Revisa la consola (F12).</span>`;
      console.error(err);
    }
  }

  function populateDropdowns(data) {
    const raritySel = document.getElementById("rarityFilter");
    const slotSel = document.getElementById("slotFilter");

    const rarities = [...new Set(data.map(d => d.rareza).filter(Boolean))].sort();
    const slots = [...new Set(data.map(d => d.espacio).filter(Boolean))].sort();

    rarities.forEach(r => raritySel.innerHTML += `<option value="${r}">${r}</option>`);
    slots.forEach(s => slotSel.innerHTML += `<option value="${s}">${s}</option>`);

    document.getElementById("searchInput").addEventListener("input", filterData);
    raritySel.addEventListener("change", filterData);
    slotSel.addEventListener("change", filterData);
  }

  function filterData() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    const selRarity = document.getElementById("rarityFilter").value;
    const selSlot = document.getElementById("slotFilter").value;

    const filtered = itemsData.filter(item => {
      const matchQ = item.nombre.toLowerCase().includes(q) || 
                     item.heroe.toLowerCase().includes(q) || 
                     item.espacio.toLowerCase().includes(q);
      const matchRarity = !selRarity || item.rareza === selRarity;
      const matchSlot = !selSlot || item.espacio === selSlot;
      return matchQ && matchRarity && matchSlot;
    });

    renderGrid(filtered);
  }

  function renderGrid(data) {
    const grid = document.getElementById("catalogGrid");
    grid.innerHTML = "";

    if (data.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px;">No hay resultados para esta búsqueda.</div>`;
      return;
    }

    data.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-img-box">
          ${item.rareza ? `<span class="card-badge">${item.rareza}</span>` : ''}
          <img src="${item.img}" alt="${item.nombre}" onerror="this.onerror=null; this.src='https://placehold.co/240x160/14161d/e5a93c?text=${encodeURIComponent(item.heroe || 'Dota 2')}';">
        </div>
        <div class="card-body">
          <div class="hero-name">${item.heroe}</div>
          <div class="item-name">${item.nombre}</div>
          <div class="item-slot">${item.espacio}</div>
          <div class="item-price">${item.precio}</div>
          <button class="btn-add" onclick="addToCart(${item.id})">+ Agregar al carrito</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

 window.addToCart = function(id) {
    const it = itemsData.find(x => x.id === id);
    if (!it) return;
    cart.push(it);
    updateCart();
  };

  window.removeFromCart = function(idx) {
    cart.splice(idx, 1);
    updateCart();
  };

  function updateCart() {
  document.getElementById("cartCount").innerText = cart.length;
  const list = document.getElementById("cartItemsList");
  list.innerHTML = "";

  let total = 0;
  cart.forEach((it, i) => {
    const rawPrice = parseFloat(it.precio.replace(/S\/\.?/g, '').replace(/[^0-9.]/g, '')) || 0;
    total += rawPrice;
    list.innerHTML += `
      <div class="cart-item">
        <div class="cart-item-info">
          <span class="cart-item-name">${it.heroe} - ${it.nombre}</span>
          <span class="cart-item-price">${it.precio}</span>
        </div>
        <button onclick="removeFromCart(${i})" style="background:none;border:none;color:#ef4444;cursor:pointer;">✕</button>
      </div>`;
  });

  document.getElementById("cartTotal").innerText = `S/. ${total.toFixed(2)}`;
}

  function openCart() {
    document.getElementById("cartDrawer").classList.add("open");
    document.getElementById("cartOverlay").style.display = "block";
  }

  function closeCart() {
    document.getElementById("cartDrawer").classList.remove("open");
    document.getElementById("cartOverlay").style.display = "none";
  }

  document.getElementById("openCartBtn").addEventListener("click", openCart);
  document.getElementById("closeCartBtn").addEventListener("click", closeCart);
  document.getElementById("cartOverlay").addEventListener("click", closeCart);

  document.getElementById("checkoutBtn").addEventListener("click", () => {
    if (cart.length === 0) return;
    const lines = cart.map(it => `• ${it.heroe} - ${it.nombre} (${it.precio})`).join("\n");
    const msg = `Hola, quiero pedir:\n${lines}\n\nTotal: ${document.getElementById("cartTotal").innerText}`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
  });

  loadCatalog();
</script>
</body> 
</html>
